[workspace]
resolver="3"
members = ["crates/subrusta-bin", "crates/subrusta-map","crates/subrusta-math", "crates/subrusta-net", "crates/subrusta-physics", "crates/subrusta-protocol", "crates/subrusta-sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Infinity Dev"]

[profile.profiling]
inherits = "release"
debug = true

[workspace.lints.clippy]
neg_cmp_op_on_partial_ord = "allow"
approx_constant = "allow"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0.229", features = [ "derive" ] }
rayon = "1.12.0"
glam = "0.34.1"
binrw = "0.15.0"
rand = "0.10"

subrusta-map = { path = "crates/subrusta-map", default-features = false }
subrusta-sim = { path = "crates/subrusta-sim", default-features = false }
subrusta-math = { path = "crates/subrusta-math", default-features = false }
subrusta-net = { path = "crates/subrusta-net", default-features = false }
subrusta-protocol = { path = "crates/subrusta-protocol", default-features = false }
subrusta-physics = { path = "crates/subrusta-physics", default-features = false }