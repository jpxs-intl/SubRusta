name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: myapp-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: myapp-windows-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            name: myapp-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename
        shell: bash
        run: |
          bin="subrusta-bin"
          [ "${{ matrix.os }}" = "windows-latest" ] && bin="$bin.exe"
          cp "target/${{ matrix.target }}/release/$bin" "${{ matrix.name }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
          generate_release_notes: true
          draft: true
